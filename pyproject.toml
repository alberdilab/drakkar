[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drakkar"
version = "2.1.6"
description = "Metagenomics pipeline optimized for Mjolnir."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Antton Alberdi", email = "antton.alberdi@sund.ku.dk"},
]
keywords = ["bioinformatics", "metagenomics", "snakemake"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "plotly",
  "biopython",
  "rich",
]

[project.optional-dependencies]
docs = [
  "sphinx>=8,<9",
  "sphinx-rtd-theme>=3,<4",
]
release = [
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
drakkar = "drakkar.cli:main"

[project.urls]
Homepage = "https://github.com/alberdilab/drakkar"
Documentation = "https://drakkar.readthedocs.io/"
Repository = "https://github.com/alberdilab/drakkar"
Changelog = "https://github.com/alberdilab/drakkar/blob/main/CHANGELOG.md"
Issues = "https://github.com/alberdilab/drakkar/issues"

[tool.setuptools.packages.find]
include = ["drakkar*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
drakkar = [
  "profile/*",
  "profile/local/*",
  "profile/slurm/*",
  "report/assets/*",
  "workflow/*",
  "workflow/envs/*",
  "workflow/rules/*",
  "workflow/scripts/*",
]
